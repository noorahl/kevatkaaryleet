<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
  </head>
  <body>
    <main>
      <form id="admin-login-container">
        <h1>Kirjaudu sisään</h1>
        <label for="adminUsername">Käyttäjänimi:</label>
        <input type="text" id="adminUsername" name="username" required />
        <label for="adminPassword">Salasana:</label>
        <input type="password" id="adminPassword" name="password" required />
        <a href="#">Unohditko salasanasi?</a>
        <button type="submit" id="admin-login-button">Kirjaudu sisään</button>
      </form>
    </main>
  </body>
</html>
